function lireChampsServeur(){
  const url = $('#sv-url').value.trim().replace(/\/+$/, '');
  const cle = $('#sv-cle').value.trim();
  if(!url || !cle){ toast("Adresse et clé sont obligatoires.", 'err'); return null; }
  if(!/^https:\/\/[\w.-]+\.supabase\.co$/.test(url)){
    toast("Adresse attendue : https://votre-projet.supabase.co", 'err'); return null; }
  if(cle.startsWith('eyJ') && cle.includes('service_role')){
    toast("C'est la clé service_role : elle donne tous les droits, ne l'utilisez pas ici.", 'err'); return null; }
  return { url, cle };
}

function enregistrerServeur(){
  const v = lireChampsServeur(); if(!v) return;
  const s = serveurConf();
  s.url = v.url; s.cle = v.cle;
  tracer('Accès serveur enregistré', v.url);
  sauver(); rendre();
  toast("Accès enregistré. Testez la connexion pour vérifier.", 'ok');
}

function oublierServeur(){
  if(!confirm("Effacer l'adresse et la clé du serveur ?\nLes données locales ne sont pas touchées.")) return;
  S.serveur = { url:'', cle:'', testeLe:null, etat:null, detail:'' };
  tracer('Accès serveur effacé', '');
  sauver(); rendre();
  toast("Accès effacé.", 'ok');
}

/* Interroge la racine de l'API REST : elle répond sans qu'aucune table
   n'existe, ce qui teste l'adresse et la clé, pas le schéma. */
async function testerServeur(){
  const v = lireChampsServeur(); if(!v) return;
  const s = serveurConf();
  s.url = v.url; s.cle = v.cle;
  toast("Test en cours…");
  try{
    const ctrl = new AbortController();
    const minuteur = setTimeout(()=>ctrl.abort(), 12000);
    const r = await fetch(v.url + '/rest/v1/', {
      headers: { apikey: v.cle, Authorization: 'Bearer ' + v.cle },
      signal: ctrl.signal
    });
    clearTimeout(minuteur);
    if(r.ok){
      s.etat = 'ok';
      s.detail = "L'adresse et la clé sont valides.";
    } else if(r.status === 401 || r.status === 403){
      s.etat = 'ko';
      s.detail = "Clé refusée (" + r.status + ") : vérifiez que c'est bien la clé « anon » de ce projet.";
    } else {
      s.etat = 'ko';
      s.detail = "Le serveur a répondu " + r.status + ".";
    }
  }catch(e){
    s.etat = 'ko';
    s.detail = (e.name === 'AbortError')
      ? "Pas de réponse en 12 secondes : vérifiez la connexion internet ou l'adresse."
      : "Serveur injoignable : adresse incorrecte, projet en pause, ou appareil hors ligne.";
  }
  s.testeLe = new Date().toISOString();
  tracer('Test du serveur', s.etat === 'ok' ? 'joignable' : 'échec — ' + s.detail);
  sauver(); rendre();
  toast(s.etat === 'ok' ? "Serveur joignable." : "Échec du test.", s.etat === 'ok' ? 'ok' : 'err');
}

          en quantité et non suivis par numéro de série, retenues traitées comme des
          indemnités imputées sur la caution, facturation sans TVA, mentions légales (RCCM, compte contribuable)
          à renseigner avant tout usage réel.</div>
      </div>
    </div>
  </div>`;
}

/* =========================================================================
   MODALE
   ========================================================================= */
function modale(titre, corps, boutons){
  $('#modale').innerHTML = `
    <header><h3>${titre}</h3><button class="x" onclick="fermerModale()">×</button></header>
    <div class="corps">${corps}</div>
    ${boutons?`<footer>${boutons}</footer>`:''}`;
  $('#voile').classList.add('on');
}
function fermerModale(){ $('#voile').classList.remove('on'); }
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ fermerModale(); fermerNav(); fermerFacture(); }
});

/* ---------- Installation sur téléphone ----------
   Le service worker rend l'application installable sur Android et la fait
   fonctionner sans réseau. Il n'existe qu'en ligne : ouvert en double-clic
   (file://), l'enregistrement est impossible et l'application marche
   déjà hors connexion de toute façon. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* Pose les mots de passe par défaut la première fois, et rattrape une
   installation antérieure à leur introduction. */
async function assurerMotsDePasse(){
  if(!S.sel) S.sel = Math.random().toString(36).slice(2) + Date.now().toString(36);
  if(!S.motsDePasse) S.motsDePasse = {};
  let change = false;
  for(const r of Object.keys(MDP_DEFAUT)){
    if(!S.motsDePasse[r]){ S.motsDePasse[r] = await empreinte(MDP_DEFAUT[r]); change = true; }
  }
  if(change) sauver();
}

/* Version publique en ligne : les visiteurs ne peuvent pas deviner les
   mots de passe, donc on les affiche. Jamais dans la version client. */
function afficherAideMdp(){
  $('#mdp-aide').innerHTML = `<div class="aide-mdp">
    <b>Démonstration publique</b> — mots de passe :<br>
    ADMIN <b>${MDP_DEFAUT.ADMIN}</b> · MANAGER <b>${MDP_DEFAUT.MANAGER}</b>
    · PRÉPARATEUR <b>${MDP_DEFAUT.PREPARATEUR}</b></div>`;
}

/* ---------- Demarrage ---------- */
if(!charger()) semer();
assurerMotsDePasse().then(()=>{ if(DEMO_PUBLIQUE) afficherAideMdp(); });
</script>
