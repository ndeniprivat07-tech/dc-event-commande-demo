<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DC EVENT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icone-180.png">
<title>DC EVENT COMMANDE</title>
<style>
/* ---------------------------------------------------------------
   DC EVENT COMMANDE - maquette de demonstration hors-ligne
   Palette calee sur le logo DC EVENT : neon rose + cyan sur noir.
   --------------------------------------------------------------- */
:root{
  --fond:#08080f; --fond2:#0e0e1b; --panneau:#13132339; --carte:#15152a;
  --bord:#26264a; --bord-clair:#343463;
  --txt:#e8e8f5; --txt2:#9a9ac0; --txt3:#6b6b90;
  --rose:#ff2d78; --rose-clair:#ff7aae; --cyan:#22d3ee; --bleu:#3b82f6;
  --vert:#22c55e; --orange:#f59e0b; --rouge:#ef4444;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,sans-serif; background:var(--fond); color:var(--txt);
  min-height:100vh; font-size:14px;
  background-image:radial-gradient(ellipse 80% 50% at 20% 0%, #2a0d3a55, transparent),
                   radial-gradient(ellipse 60% 50% at 90% 10%, #08325a55, transparent);
  background-attachment:fixed;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;touch-action:manipulation}
/* iOS : empeche le grossissement du texte en rotation et le halo bleu au toucher */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
a{color:var(--cyan)}

/* ---------- Ecran de connexion ---------- */
#login{
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:26px; z-index:100;
  background:var(--fond);
  background-image:radial-gradient(ellipse 70% 60% at 50% 30%, #3a0f4a66, transparent),
                   radial-gradient(ellipse 60% 40% at 50% 100%, #0a3a6666, transparent);
}
#login img{width:190px;border-radius:50%;box-shadow:0 0 60px #ff2d7855,0 0 120px #22d3ee33}
#login h1{font-size:26px;letter-spacing:5px;font-weight:300}
#login h1 b{font-weight:700;background:linear-gradient(90deg,var(--rose),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#login p{color:var(--txt2);margin-top:-16px;font-size:13px}
.roles{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.role{
  width:210px;padding:22px 18px;border:1px solid var(--bord);border-radius:14px;
  background:var(--carte);text-align:center;transition:.18s;
}
.role:hover{border-color:var(--rose);transform:translateY(-4px);box-shadow:0 10px 34px #ff2d7833}
.role .ic{font-size:30px;display:block;margin-bottom:10px}

/* Saisie du mot de passe : remplace la grille des profils */
#etape-mdp{display:none;width:100%;max-width:340px;text-align:center;padding:0 16px}
#etape-mdp.on{display:block}
.mdp-ic{font-size:34px;margin-bottom:8px}
.mdp-role{font-weight:700;letter-spacing:2px;font-size:15px}
.mdp-qui{color:var(--txt2);font-size:13px;margin-bottom:16px}
#mdp-champ{width:100%;padding:13px 15px;background:#0a0a16;border:1px solid var(--bord);
  border-radius:10px;outline:none;font-size:16px;text-align:center;letter-spacing:2px;
  transition:.15s}
#mdp-champ:focus{border-color:var(--rose);box-shadow:0 0 0 3px #ff2d7822}
#mdp-champ.faux{border-color:var(--rouge);animation:secousse .3s}
@keyframes secousse{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mdp-err{min-height:20px;color:#fca5a5;font-size:12.5px;margin:9px 0 4px;line-height:1.4}
#mdp-aide{max-width:400px;padding:0 16px}
.aide-mdp{border:1px dashed var(--bord-clair);border-radius:10px;padding:12px 15px;
  font-size:12px;color:var(--txt2);line-height:1.7;text-align:left}
.aide-mdp b{color:var(--txt);font-family:monospace;letter-spacing:.5px}
.code-secours{font-family:monospace;font-size:26px;font-weight:700;letter-spacing:3px;
  text-align:center;padding:18px 10px;margin:16px 0;border-radius:12px;
  background:#0a0a16;border:1px dashed var(--rose);color:var(--rose-clair);
  user-select:all;word-break:break-all}
.bio{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:13px;margin-bottom:14px;border-radius:10px;font-size:14.5px;font-weight:600;
  background:linear-gradient(135deg,var(--cyan),var(--bleu));color:#04121c}
.bio:active{filter:brightness(.92)}
.bio .ic{font-size:19px}
.ou{display:flex;align-items:center;gap:10px;color:var(--txt3);font-size:11.5px;
  letter-spacing:1.5px;margin-bottom:12px}
.ou::before,.ou::after{content:'';flex:1;height:1px;background:var(--bord)}
.role .nom{display:block;font-weight:700;letter-spacing:1.5px;margin-bottom:7px}
.role .desc{display:block;font-size:12px;color:var(--txt2);line-height:1.5}

/* ---------- Ossature ---------- */
#app{display:none;grid-template-columns:236px 1fr;min-height:100vh}
#app.on{display:grid}
aside{
  background:#0b0b16; border-right:1px solid var(--bord);
  padding:18px 12px; display:flex; flex-direction:column; gap:4px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.marque{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.marque img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 18px #ff2d7855}
.marque .t1{font-weight:700;letter-spacing:2px;font-size:14px;line-height:1.2}
.marque .t2{font-size:10px;color:var(--txt3);letter-spacing:2.5px}
nav button{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;
  border-radius:8px;color:var(--txt2);text-align:left;transition:.14s;font-size:13.5px;
}
nav button:hover{background:#ffffff0d;color:var(--txt)}
nav button.actif{background:linear-gradient(90deg,#ff2d7826,transparent);color:#fff;
  box-shadow:inset 2px 0 0 var(--rose)}
nav button .pastille{margin-left:auto;background:var(--rose);color:#fff;font-size:10px;
  font-weight:700;padding:2px 7px;border-radius:20px}
.qui{margin-top:auto;border-top:1px solid var(--bord);padding-top:14px}
.qui .r{font-size:11px;color:var(--txt3);letter-spacing:1.5px}
.qui .n{font-weight:600;margin:2px 0 10px}

main{padding:26px 30px 60px;max-width:1500px}
.tbl-scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}

/* Fiche de travail du préparateur : lisible au pouce, sans défilement latéral */
/* Titres numérotés des blocs de saisie : le parcours doit se lire d'un coup */
.etiq{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:14px}
.etiq-n{width:23px;height:23px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(135deg,var(--rose),#c026d3);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.etiq-c{background:#22d3ee1f;color:var(--cyan);font-size:11.5px;font-weight:700;
  padding:2px 9px;border-radius:20px}

/* Matériel retenu : une fiche par ligne, avec incrément tactile */
.sel{background:#0a0a16;border:1px solid var(--bord);border-radius:10px;
  padding:12px 14px;margin-bottom:9px}
.sel:last-child{margin-bottom:0}
.sel-tete{display:flex;align-items:flex-start;gap:10px}
.sel-nom{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.35}
.sel-ref{display:block;font-size:11px;color:var(--txt3);font-weight:400;
  letter-spacing:.3px;margin-top:3px;text-transform:uppercase}
.sel-x{flex:0 0 auto}
.sel-bas{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px}
.pas{display:flex;align-items:center;gap:2px;background:#ffffff0d;
  border:1px solid var(--bord);border-radius:9px;overflow:hidden}
.pas-b{width:38px;height:36px;font-size:19px;font-weight:700;color:var(--rose-clair);
  display:flex;align-items:center;justify-content:center;transition:.12s}
.pas-b:hover:not(:disabled){background:var(--rose);color:#fff}
.pas-b:disabled{opacity:.3;cursor:not-allowed}
.pas-v{min-width:46px;text-align:center;font-weight:700;font-size:15px;
  font-variant-numeric:tabular-nums}
.sel-tot{text-align:right;font-weight:700;font-size:15px;white-space:nowrap}
.sel-det{display:block;font-size:11px;color:var(--txt3);font-weight:400;margin-top:2px}

/* Champs obligatoires */
.req{color:var(--rose);font-style:normal;font-weight:700;margin-left:1px}
.legende-req{color:var(--txt3);font-size:11.5px;margin-top:12px}
.legende-req .req{margin-right:3px}

/* Réduction : saisie en pourcentage ou en francs */
.duo{display:flex;gap:9px;align-items:stretch}
.duo input{flex:1;min-width:0}
.bascule{display:flex;flex:0 0 auto;border:1px solid var(--bord);border-radius:8px;overflow:hidden}
.bascule button{padding:0 13px;font-size:12.5px;font-weight:600;color:var(--txt3);
  background:#0a0a16;transition:.14s;white-space:nowrap}
.bascule button:hover{color:var(--txt)}
.bascule button.on{background:linear-gradient(135deg,var(--rose),#c026d3);color:#fff}

/* Photos du catalogue */
.vignette{width:42px;height:42px;flex:0 0 auto;border-radius:8px;object-fit:cover;
  background:#0a0a16;border:1px solid var(--bord)}
img.vignette{cursor:zoom-in}
.vide-photo{display:flex;align-items:center;justify-content:center;
  font-size:16px;opacity:.35}
.avec-photo{display:flex;align-items:center;gap:11px}
.apercu-photo{display:flex;align-items:center;gap:12px;margin-top:10px}
.apercu-photo img{width:96px;height:96px;object-fit:cover;border-radius:10px;
  border:1px solid var(--bord)}

/* Sélecteur d'articles : filtres en pastilles + liste cliquable */
.puces{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.puce{padding:6px 13px;border-radius:20px;border:1px solid var(--bord);
  background:var(--carte);color:var(--txt2);font-size:12.5px;transition:.14s;white-space:nowrap}
.puce:hover{border-color:var(--bord-clair);color:var(--txt)}
.puce.on{background:linear-gradient(135deg,var(--rose),#c026d3);border-color:transparent;
  color:#fff;font-weight:600}
.puce.raz{color:var(--txt3)}
.liste-art{max-height:290px;overflow-y:auto;border:1px solid var(--bord);
  border-radius:10px;background:#0a0a16;-webkit-overflow-scrolling:touch}
.art{display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;
  border-bottom:1px solid #ffffff0a;text-align:left;transition:.12s}
.art:last-child{border-bottom:none}
.art:hover:not(:disabled){background:#ff2d7814}
.art:disabled{opacity:.4;cursor:not-allowed}
.art-txt{flex:1;min-width:0}
.art-nom{display:block;font-weight:600;font-size:13.5px;line-height:1.35}
.art-sous{display:block;font-size:11.5px;color:var(--txt3);margin-top:2px}
.art-deja{background:#22d3ee1f;color:var(--cyan);font-size:11.5px;font-weight:700;
  padding:2px 9px;border-radius:20px;flex:0 0 auto}
.art-plus{width:28px;height:28px;border-radius:50%;background:#ffffff12;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
  color:var(--rose-clair)}
.art:hover:not(:disabled) .art-plus{background:var(--rose);color:#fff}

/* Fil d'Ariane des étapes de saisie */
.ruban{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ruban-e{display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:26px;
  border:1px solid var(--bord);background:var(--carte);color:var(--txt3);font-size:13px}
.ruban-e.actif{border-color:var(--rose);color:var(--txt);box-shadow:0 0 0 3px #ff2d7818}
.ruban-e.fait{color:var(--txt2);border-color:#22c55e55}
.ruban-n{width:21px;height:21px;border-radius:50%;background:#ffffff14;color:inherit;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.ruban-e.actif .ruban-n{background:linear-gradient(135deg,var(--rose),#c026d3);color:#fff}
.ruban-e.fait .ruban-n{background:#22c55e2e;color:#6ee7a0}
.ruban-t{flex:1;min-width:16px;height:1px;background:var(--bord)}

.job{background:#0a0a16;border:1px solid var(--bord);border-radius:10px;
  padding:13px 15px;margin-bottom:10px}
.job:last-child{margin-bottom:0}
.job-tete{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.job-num{font-variant-numeric:tabular-nums;font-size:12px;color:var(--txt3);letter-spacing:.5px}
.job-qte{margin-left:auto;background:#22d3ee1f;color:var(--cyan);font-size:11.5px;
  font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.job-client{font-size:16px;font-weight:700;margin-bottom:6px;line-height:1.3}
.job-info{color:var(--txt2);font-size:13px;line-height:1.7}
.job-actions{display:flex;gap:9px;margin-top:12px}
.job-actions .btn{flex:1;padding:9px 12px}
.deux-col{grid-template-columns:1fr 380px;align-items:start}

/* Barre du haut : mobile uniquement (masquee en grand ecran) */
#barre{display:none}
.entete{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.entete h2{font-size:23px;font-weight:600}
.entete .sous{color:var(--txt2);font-size:13px;margin-top:3px}
.entete .droite{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}

/* ---------- Briques ---------- */
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);padding:18px}
.grille{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat .lab{font-size:11px;letter-spacing:1.4px;color:var(--txt3);text-transform:uppercase}
.stat .val{font-size:27px;font-weight:700;margin:7px 0 2px}
.stat .det{font-size:12px;color:var(--txt2)}
.stat.rose .val{color:var(--rose-clair)} .stat.cyan .val{color:var(--cyan)}
.stat.orange .val{color:var(--orange)} .stat.vert .val{color:var(--vert)}
.stat.rouge .val{color:var(--rouge)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:1.2px;color:var(--txt3);
  text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--bord);font-weight:600}
td{padding:11px 10px;border-bottom:1px solid #ffffff0a;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#ffffff07}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}

.btn{padding:8px 15px;border-radius:8px;background:#ffffff12;border:1px solid var(--bord);
  transition:.15s;font-size:13px;white-space:nowrap}
.btn:hover{background:#ffffff1f;border-color:var(--bord-clair)}
.btn.p{background:linear-gradient(135deg,var(--rose),#c026d3);border-color:transparent;
  color:#fff;font-weight:600;box-shadow:0 4px 18px #ff2d7840}
.btn.p:hover{filter:brightness(1.14)}
.btn.c{background:linear-gradient(135deg,var(--cyan),var(--bleu));border-color:transparent;
  color:#04121c;font-weight:700}
.btn.v{background:#22c55e22;border-color:#22c55e55;color:#6ee7a0}
.btn.r{background:#ef444422;border-color:#ef444455;color:#fca5a5}
.btn.mini{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}

.et{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;
  font-weight:600;letter-spacing:.4px;white-space:nowrap}
.et.DEVIS{background:#6b7280335;background:#6b728033;color:#c4c9d4}
.et.RESERVEE{background:#3b82f628;color:#93c5fd}
.et.PREPAREE{background:#a855f728;color:#d8b4fe}
.et.LIVREE{background:#f59e0b28;color:#fcd34d}
.et.RETOURNEE{background:#22d3ee28;color:#7de8f8}
.et.FACTUREE{background:#22c55e28;color:#86efac}
.et.SOLDEE{background:#22c55e40;color:#bbf7d0}
.et.ANNULEE{background:#ef444428;color:#fca5a5}
.et.EN_ATTENTE{background:#f59e0b28;color:#fcd34d}
.et.APPROUVEE{background:#22c55e28;color:#86efac}
.et.REFUSEE{background:#ef444428;color:#fca5a5}

.champ{margin-bottom:14px}
.champ label{display:block;font-size:11.5px;letter-spacing:1.1px;color:var(--txt3);
  text-transform:uppercase;margin-bottom:6px}
.champ input,.champ select,.champ textarea{
  width:100%;padding:9px 12px;background:#0a0a16;border:1px solid var(--bord);
  border-radius:8px;outline:none;transition:.15s}
.champ input:focus,.champ select:focus,.champ textarea:focus{
  border-color:var(--rose);box-shadow:0 0 0 3px #ff2d7822}
.champ textarea{resize:vertical;min-height:78px}
.paire{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- Fenetre modale ---------- */
#voile{position:fixed;inset:0;background:#000000c4;backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
#voile.on{display:flex}
.modale{background:var(--fond2);border:1px solid var(--bord-clair);border-radius:14px;
  width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  box-shadow:0 30px 90px #000c}
.modale header{padding:18px 22px;border-bottom:1px solid var(--bord);
  display:flex;align-items:center;gap:12px}
.modale header h3{font-size:17px;font-weight:600}
.modale header .x{margin-left:auto;color:var(--txt3);font-size:22px;line-height:1}
.modale header .x:hover{color:var(--txt)}
.modale .corps{padding:22px}
.modale footer{padding:16px 22px;border-top:1px solid var(--bord);
  display:flex;gap:10px;justify-content:flex-end}

/* =====================================================================
   FACTURE — document sur fond blanc, pensé pour l'impression A4
   ===================================================================== */
#voile-facture{position:fixed;inset:0;background:#000000d0;backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;z-index:250;
  padding:20px;overflow-y:auto}
#voile-facture.on{display:flex}
#facture-boite{width:100%;max-width:820px}
#facture-barre{display:flex;gap:10px;justify-content:flex-end;margin-bottom:12px}
#facture{background:#fff;color:#1a1a1a;padding:38px 40px;border-radius:6px;
  font-size:13px;line-height:1.5;box-shadow:0 24px 70px #000a}
#facture img{width:66px;height:66px;border-radius:50%;flex:0 0 auto}
.fac-tete{display:flex;justify-content:space-between;gap:26px;
  padding-bottom:20px;border-bottom:2px solid #1a1a1a;margin-bottom:22px}
.fac-emet{display:flex;gap:15px;align-items:flex-start}
.fac-nom{font-size:19px;font-weight:800;letter-spacing:.6px;margin-bottom:3px}
.fac-p{color:#555;font-size:11.5px;line-height:1.55}
.fac-lab{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;
  color:#888;font-weight:700;margin-bottom:4px}
.fac-fort{font-weight:700;font-size:14px;margin-bottom:2px}
.fac-ref{text-align:right;flex:0 0 auto}
.fac-titre{font-size:25px;font-weight:800;letter-spacing:3px;color:#c2185b}
.fac-num{font-size:15px;font-weight:700;margin:2px 0 6px}
.fac-parties{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:22px}
.fac-lignes-wrap{margin-bottom:22px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fac-lignes{width:100%;border-collapse:collapse;min-width:470px}
.fac-lignes th{background:#f2f2f5;color:#444;font-size:10px;letter-spacing:.9px;
  text-transform:uppercase;padding:9px 10px;border:none;text-align:left}
.fac-lignes th.num,.fac-lignes td.num{text-align:right}
.fac-lignes td{padding:8px 10px;border-bottom:1px solid #e8e8ee;font-size:12.5px}
.fac-bas{display:grid;grid-template-columns:1fr 300px;gap:26px;align-items:start}
.fac-mentions .fac-p{margin-bottom:2px}
.fac-totaux{width:100%;border-collapse:collapse}
.fac-totaux td{padding:6px 10px;font-size:12.5px;border:none}
.fac-totaux .ft-lab{color:#555}
.fac-totaux .ft-val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fac-totaux .ft-sous td{border-top:1px solid #ccc;font-weight:700;color:#1a1a1a}
.fac-totaux .ft-net td{border-top:2px solid #1a1a1a;font-size:15px;font-weight:800;
  color:#c2185b;padding-top:9px}

<script>
/* =========================================================================
   DC EVENT COMMANDE
   Maquette de demonstration. Tout tient dans ce fichier : aucune connexion
   reseau, aucune installation. Les donnees vivent dans localStorage.

   Regle centrale du cahier des charges :
     le MANAGER ajoute librement, mais retirer un article, annuler une
     commande ou accorder une remise > 10 % exige une validation ADMIN
     assortie d'un motif.
   ========================================================================= */

const CLE = 'dc-event-commande.v2';   // v2 : conditions financières par commande
const DEMO_PUBLIQUE = true;      // mis à true dans la version publique en ligne
const MDP_DEFAUT = { ADMIN:'dc-admin', MANAGER:'dc-manager', PREPARATEUR:'dc-depot' };
const MAX_ESSAIS = 5;             // au-delà, le profil se bloque une minute
const SEUIL_REMISE = 10;          // % au-dela duquel l'ADMIN doit valider
let S = null;                      // etat complet de l'application
let U = null;                      // utilisateur connecte
let vueCourante = 'tableau';
let brouillon = null;              // commande en cours de saisie

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const auj = () => new Date(new Date().toDateString());
function jour(n){ const d = auj(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function frDate(iso){ if(!iso) return '—';
  const [a,m,j] = iso.split('-'); return `${j}/${m}/${a}`; }
function frCourt(iso){ const [a,m,j] = iso.split('-'); return `${j}/${m}`; }
function fcfa(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ' F'; }
/* Taux réel arrondi au dixième, sans décimale inutile : 5 % et non 5,0 % */
function pct(n){ const v = Math.round(n*10)/10; return (v % 1 ? v.toFixed(1).replace('.',',') : v) + ' %'; }
function nbJours(d1,d2){ return Math.max(1, Math.round((new Date(d2)-new Date(d1))/864e5)+1); }
function chevauche(a1,a2,b1,b2){ return a1 <= b2 && b1 <= a2; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function uid(p){ return p + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }

function toast(msg, type){
  const t = $('#toast');
  t.textContent = msg; t.className = 'on ' + (type||'');
  clearTimeout(t._h); t._h = setTimeout(()=>t.className='', 2600);
}

/* ---------- Persistance ---------- */
// Ouvert en double-clic (file://), certains navigateurs refusent localStorage.
// L'application doit continuer a tourner : on perd la persistance, pas la demo.
let persistanceOk = true;
function sauver(){
  if(!persistanceOk) return;
  try{ localStorage.setItem(CLE, JSON.stringify(S)); }
  catch(e){ persistanceOk = false;
    toast("Navigateur en lecture seule : la démo fonctionne, mais rien ne sera conservé à la fermeture."); }
}
function charger(){
  try{ const b = localStorage.getItem(CLE); if(b){ S = JSON.parse(b); return true; } }catch(e){}
  return false;
}
function reinitialiser(){
  if(!confirm("Remettre la démonstration à son état initial ?\nToutes les saisies faites depuis le début seront effacées.")) return;
  try{ localStorage.removeItem(CLE); }catch(e){}
  location.reload();
}

/* ---------- Journal de tracabilite ---------- */
function tracer(action, detail, cible){
  S.journal.unshift({
    id: uid('J'), quand: new Date().toISOString(),
    qui: U ? U.nom : 'Système', role: U ? U.role : 'SYSTEME',
    action, detail, cible: cible || ''
  });
  if(S.journal.length > 300) S.journal.length = 300;
}

/* =========================================================================
   JEU DE DONNEES INITIAL
   ========================================================================= */
function semer(){
  // valeur = prix de remplacement à neuf, base des retenues sur caution
  const art = (ref,nom,cat,qte,prix,valeur,unite) =>
    ({id:ref,ref,nom,cat,qte,prix,valeur,unite:unite||'unité'});
  S = {
    societe:{
      nom:'DC EVENT', activite:'Location de matériel événementiel et décoration',
      tel:'07 00 00 00 01', mail:'demo@dc-event.example', ville:'Abidjan, Côte d\'Ivoire',
      // À REMPLACER par les mentions légales réelles avant tout usage commercial
      rccm:'RCCM CI-ABJ-XXXX-X-XXXXX', cc:'Compte contribuable : XXXXXXXX',
      delaiReglement:30
    },
    articles:[
      art('SON-01','Enceinte active 15" 800W','Sonorisation',12,25000,450000),
      art('SON-02','Caisson de basse 18"','Sonorisation',6,35000,600000),
      art('SON-03','Table de mixage 12 voies','Sonorisation',4,30000,500000),
      art('SON-04','Micro HF main (paire)','Sonorisation',8,15000,250000),
      art('ECL-01','Par LED 54x3W','Éclairage',24,8000,85000),
      art('ECL-02','Lyre beam 230W','Éclairage',8,40000,700000),
      art('ECL-03','Machine à fumée 1500W','Éclairage',4,20000,180000),
      art('ECL-04','Projecteur architectural','Éclairage',16,10000,110000),
      art('MOB-01','Chaise Napoléon dorée','Mobilier',400,1500,18000),
      art('MOB-02','Table ronde 180 cm (10 pers.)','Mobilier',45,7000,75000),
      art('MOB-03','Table serpentin','Mobilier',12,25000,260000),
      art('MOB-04','Housse de chaise + nœud','Mobilier',400,800,6000),
      art('MOB-05','Nappe ronde satin','Mobilier',60,2500,15000),
      art('STR-01','Tente 5x10 m','Structure',6,150000,2500000),
      art('STR-02','Barnum 3x3 m','Structure',14,35000,450000),
      art('STR-03','Praticable 2x1 m','Structure',20,12000,140000),
      art('VID-01','Écran LED P3 (m²)','Vidéo',18,60000,900000,'m²'),
      art('VID-02','Vidéoprojecteur 5000 lumens','Vidéo',4,75000,1200000),
      art('VID-03','Écran de projection 3 m','Vidéo',3,30000,220000),
      art('DEC-01','Arche florale','Décoration',5,90000,400000),
      art('DEC-02','Tapis rouge 10 m','Décoration',4,45000,300000),
      art('DEC-03','Colonne lumineuse','Décoration',20,9000,95000)
    ],
    commandes:[], validations:[], paiements:[], journal:[],
    compteur:{ cmd:0, fac:0 },
    // Le sel est propre à cette installation : deux postes n'auront pas la
    // même empreinte pour un même mot de passe.
    sel: Math.random().toString(36).slice(2) + Date.now().toString(36),
    motsDePasse: {}
  };

  const L = (id,q) => { const a = S.articles.find(x=>x.id===id);
    return {articleId:id, ref:a.ref, nom:a.nom, qte:q, prix:a.prix}; };

  function cmd(o){
    S.compteur.cmd++;
    const c = Object.assign({
      id: uid('C'),
      num: 'CMD-2026-' + String(S.compteur.cmd).padStart(3,'0'),

/* =========================================================================
   DISPONIBILITE  —  le stock est un calendrier, pas un compteur
   ========================================================================= */
const STATUTS_BLOQUANTS = ['RESERVEE','PREPAREE','LIVREE'];

function reserve(articleId, d1, d2, saufCmdId){
  let n = 0;
  for(const c of S.commandes){
    if(c.id === saufCmdId) continue;
    if(!STATUTS_BLOQUANTS.includes(c.statut)) continue;
    if(!chevauche(c.debut, c.fin, d1, d2)) continue;
    for(const l of c.lignes) if(l.articleId === articleId) n += l.qte;
  }
  return n;
}
function dispo(articleId, d1, d2, saufCmdId){
  const a = S.articles.find(x=>x.id===articleId);
  return a.qte - reserve(articleId, d1, d2, saufCmdId);
}

/* =========================================================================
   CALCULS FINANCIERS — cascade normalisée d'une facture
     Total location
       − remise commerciale      (geste sur le prix, en % ou en francs)
     = net commercial
       − escompte                (geste pour paiement anticipé)
     = net financier
       + transport               (hors réductions : le camion ne se remise pas)
     = total
       + caution                 (consignée, remboursable, hors chiffre d'affaires)
     = total à encaisser
       − déjà réglé
     = net à payer
   ========================================================================= */
/* Une réduction se saisit indifféremment en pourcentage ou en montant.
   On conserve le mode choisi pour éviter les arrondis d'aller-retour :
   50 000 F saisis restent 50 000 F, et non 8,44 % recalculés à 49 998 F. */
function reduction(valeur, mode, base){
  if(!valeur) return 0;
  return mode === 'montant' ? Math.min(valeur, base) : base * valeur / 100;
}

function totalCommande(c){
  const j = nbJours(c.debut, c.fin);
  const brut = c.lignes.reduce((s,l)=>s + l.qte * l.prix * j, 0);

  const remise   = reduction(c.remise,   c.remiseMode,   brut);
  const netCom   = brut - remise;
  const escompte = reduction(c.escompte, c.escompteMode, netCom);
  const netFin   = netCom - escompte;

  // Le transport s'ajoute APRÈS les réductions : une remise se négocie sur la
  // location, pas sur le carburant et le camion.
  const transport = c.transport || 0;
  const total     = netFin + transport;
  const caution   = c.caution || 0;

  // Taux réels, pour l'affichage et pour la règle de validation
  const tauxRemise   = brut   ? remise   / brut   * 100 : 0;
  const tauxEscompte = netCom ? escompte / netCom * 100 : 0;

  // Retenues pour casse et matériel non restitué, imputées sur la caution.
  // Ce sont des indemnités, imputées sur la caution.
  const retenue = (c.retenues||[]).reduce((s,x)=>s+x.montant, 0);
  const cautionRendue = Math.max(0, caution - retenue);
  const excedent      = Math.max(0, retenue - caution);

  return { jours:j, brut, tauxRemise, remise, netCom, tauxEscompte, escompte,
           netFin, transport, total, caution,
           retenue, cautionRendue, excedent,
           aEncaisser: total + caution,   // avant retour : location + consigne
           duFinal: total + retenue,      // après retour : location + dégâts
           net: total };          // « net » = chiffre d'affaires, caution exclue
}
function encaisse(cmdId){
  return S.paiements.filter(p=>p.commandeId===cmdId).reduce((s,p)=>s+p.montant,0);
}
/* Ce que le client doit réellement : tant que le retour n'est pas arbitré,
   la caution reste consignée ; ensuite elle est soldée contre les dégâts. */
function duTotal(c){
  const t = totalCommande(c);
  return c.retenuesFaites ? t.duFinal : t.aEncaisser;
}
function reste(c){ return Math.max(0, duTotal(c) - encaisse(c.id)); }
function aRestituer(c){ return Math.max(0, encaisse(c.id) - duTotal(c)); }
function incidents(c){
  if(!c.retour) return [];
  return [...c.retour.casse.map(x=>Object.assign({type:'CASSE'},x)),
          ...c.retour.manquant.map(x=>Object.assign({type:'MANQUANT'},x))];
}

/* Réduction totale consentie, en pourcentage réel du brut : c'est elle qui
   déclenche l'ADMIN. Calculée sur les montants, donc insensible au mode de
   saisie — impossible de contourner le seuil en passant en francs. */
function reductionTotale(c){
  const t = totalCommande(c);
  return t.brut ? Math.round((t.remise + t.escompte) / t.brut * 1000) / 10 : 0;
}

/* =========================================================================
   MOTS DE PASSE
   Empreinte SHA-256 salée : le mot de passe n'est jamais stocké en clair.
   La vérification reste locale à l'appareil — elle protège d'un curieux sur
   un téléphone partagé, pas d'une personne capable de lire le code source.
   ========================================================================= */
const ITERATIONS = 150000;        // coût de dérivation : ~0,3 s ici, des mois pour une attaque

const hex = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');

/* Empreinte historique, un seul passage de SHA-256. Conservée uniquement
   pour reconnaître les installations antérieures et les faire migrer. */
async function hacher(txt, sel){
  const donnee = (sel || '') + '|' + txt;
  if(window.crypto && crypto.subtle)
    return hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(donnee)));
  let h = 0;
  for(let i=0; i<donnee.length; i++) h = (Math.imul(h,31) + donnee.charCodeAt(i)) | 0;
  return 'r' + (h>>>0).toString(16);
}

/* PBKDF2 : la dérivation est délibérément lente. Une empreinte volée ne se
   casse plus par force brute en quelques secondes, mais en des mois. */
async function deriver(txt, sel, iter){
  const cle = await crypto.subtle.importKey('raw',
    new TextEncoder().encode(txt), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt:new TextEncoder().encode(sel), iterations:iter, hash:'SHA-256' },
    cle, 256);
  return hex(bits);
}

/* Empreinte de stockage : format « pbkdf2$<itérations>$<empreinte> ». */
async function empreinte(txt){
  if(window.crypto && crypto.subtle)
    return `pbkdf2$${ITERATIONS}$${await deriver(txt, S.sel, ITERATIONS)}`;
  return await hacher(txt, S.sel);          // repli, signalé à l'écran Mots de passe
}

/* Vérifie une saisie contre une empreinte stockée, quel que soit son format.
   Une empreinte à l'ancien format est remplacée dès qu'elle est validée. */
async function verifier(txt, stocke){
  if(!stocke) return false;
  if(stocke.startsWith('pbkdf2$')){
    const [, iter, att] = stocke.split('$');
    return await deriver(txt, S.sel, parseInt(iter)) === att;
  }
  return await hacher(txt, S.sel) === stocke;   // ancien format
}
function ancienFormat(stocke){ return !!stocke && !stocke.startsWith('pbkdf2$'); }

/* ---------- Politique de mot de passe ---------- */
const MDP_MIN = 8;
function critiquerMdp(mdp, role){
  if(mdp.length < MDP_MIN) return `Au moins ${MDP_MIN} caractères (actuellement ${mdp.length}).`;
  const b = mdp.toLowerCase();
  if(Object.values(MDP_DEFAUT).includes(b)) return "C'est le mot de passe d'origine, connu de tous.";
  if(b.includes(role.toLowerCase())) return "Il ne doit pas contenir le nom du profil.";
  if(b.includes('dcevent') || b.includes('dc-event')) return "Il ne doit pas contenir le nom de l'application.";
  if(/^(.)\1+$/.test(mdp)) return "Un même caractère répété se devine immédiatement.";
  if(/^\d+$/.test(mdp)) return "Uniquement des chiffres : trop facile à essayer en série.";
  if(/^(012|123|234|345|456|567|678|789|abc|qwe|aze)/.test(b)) return "Suite trop prévisible.";
  return null;                                  // accepté
}

/* ---------- Code de secours ----------
   Seul recours si l'ADMIN oublie son mot de passe : sans lui, il faudrait
   effacer toutes les données. Comme les mots de passe, seule son empreinte
   est conservée — le code lui-même n'existe que sur le papier de l'ADMIN. */
const ALPHABET_CODE = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // sans O/0, I/1, L

function genererCode(){
  const n = new Uint32Array(12);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(n);
  else for(let i=0;i<12;i++) n[i] = Math.floor(Math.random()*4294967295);
  let s = '';
  for(let i=0;i<12;i++){
    s += ALPHABET_CODE[n[i] % ALPHABET_CODE.length];
    if(i % 4 === 3 && i < 11) s += '-';
  }
  return s;
}

async function genererCodeSecours(){
  const code = genererCode();

/* =========================================================================
   DÉVERROUILLAGE PAR EMPREINTE (WebAuthn)
   Utilise le capteur du téléphone via l'authentificateur intégré. Sans
   serveur, la signature n'est pas vérifiée à distance : c'est un verrou
   local, de force équivalente au mot de passe qu'il remplace, pas une
   authentification opposable. Le mot de passe reste toujours accepté.
   ========================================================================= */
const b64 = {
  vers: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
  depuis: s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
};
function alea(n){
  const t = new Uint8Array(n);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(t);
  else for(let i=0;i<n;i++) t[i] = Math.floor(Math.random()*256);
  return t;
}

/* Dans l'APK, la WebView n'implémente pas WebAuthn : une passerelle native
   expose BiometricPrompt sous le nom AndroidBio. On la préfère quand elle
   existe, et on retombe sur WebAuthn dans un navigateur. */
const surAndroid = () => typeof AndroidBio !== 'undefined' && AndroidBio;

let bioAttente = null;
window.__bioReponse = function(ok, message){
  if(!bioAttente) return;
  const f = bioAttente; bioAttente = null;
  f({ ok: (ok === true || ok === 'true'), message: message || '' });
};
function demanderBioAndroid(){
  return new Promise(res=>{
    bioAttente = res;
    try{ AndroidBio.demander('DC EVENT COMMANDE', "Confirmez votre identité"); }
    catch(e){ bioAttente = null; res({ ok:false, message:'passerelle indisponible' }); }
    // Filet de sécurité : si la passerelle ne répond jamais, on ne fige pas l'écran.
    setTimeout(()=>{ if(bioAttente){ const f=bioAttente; bioAttente=null;
      f({ ok:false, message:'délai dépassé' }); } }, 65000);
  });
}

async function empreinteDispo(){
  try{
    if(surAndroid()) return AndroidBio.disponible() === true;
    if(!window.PublicKeyCredential) return false;
    if(!location.protocol.startsWith('http')) return false;   // exige une origine sûre
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  }catch(e){ return false; }
}

async function activerEmpreinte(role){
  if(!await empreinteDispo()){
    toast("Cet appareil ne propose pas de déverrouillage biométrique.", 'err'); return; }

  // Sur Android, l'empreinte est gérée par le système : rien à enrôler ici.
  // On demande une vérification immédiate pour confirmer que ça marche.
  if(surAndroid()){
    const r = await demanderBioAndroid();
    if(!r.ok){ toast("Activation abandonnée : " + (r.message || 'refusée'), 'err'); return; }
    if(!S.biometrie) S.biometrie = {};
    S.biometrie[role] = 'android';
    tracer('Empreinte activée', `profil ${role} (système Android)`);
    sauver(); fermerModale(); rendre();
    toast(`Déverrouillage par empreinte activé pour ${role}.`, 'ok');
    return;
  }

  try{
    const cred = await navigator.credentials.create({ publicKey:{
      challenge: alea(32),
      rp: { name: 'DC EVENT COMMANDE' },
      user: { id: new TextEncoder().encode(role), name: role,
              displayName: UTILISATEURS[role].nom },
      pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      timeout: 60000, attestation: 'none'
    }});
    if(!cred) throw new Error('annulé');
    if(!S.biometrie) S.biometrie = {};
    S.biometrie[role] = b64.vers(cred.rawId);
    tracer('Empreinte activée', `profil ${role}`);
    sauver(); fermerModale(); rendre();
    toast(`Déverrouillage par empreinte activé pour ${role}.`, 'ok');
  }catch(e){
    toast("Activation abandonnée ou refusée par l'appareil.", 'err');
  }
}

function desactiverEmpreinte(role){
  if(S.biometrie) delete S.biometrie[role];
  tracer('Empreinte désactivée', `profil ${role}`);
  sauver(); rendre();
  toast(`Empreinte désactivée pour ${role}. Le mot de passe reste actif.`, 'ok');
}

async function connexionEmpreinte(role){
  const id = S.biometrie && S.biometrie[role];
  if(!id) return;
  const err = $('#mdp-err');
  err.textContent = '';

  if(id === 'android' || surAndroid()){
    const r = await demanderBioAndroid();
    if(r.ok){
      const rr = roleChoisi;
      succes('mdp:' + rr);
      retourRoles(); connexion(rr);
      tracer('Connexion par empreinte', UTILISATEURS[rr].nom); sauver();
    } else {
      err.textContent = "Empreinte non reconnue — utilisez le mot de passe.";
    }
    return;
  }

  try{
    const ok = await navigator.credentials.get({ publicKey:{
      challenge: alea(32),
      allowCredentials: [{ type:'public-key', id: b64.depuis(id) }],
      userVerification: 'required', timeout: 60000
    }});
    if(!ok) throw new Error('annulé');
    const r = roleChoisi;
    retourRoles();
    connexion(r);
    tracer('Connexion par empreinte', UTILISATEURS[r].nom);
    sauver();
  }catch(e){
    err.textContent = "Empreinte non reconnue — utilisez le mot de passe.";
  }
}

let roleChoisi = null;

/* Le compteur d'essais vit dans les données enregistrées, pas en mémoire :
   sinon il suffirait de recharger la page pour repartir à zéro. */
function compteur(cle){
  if(!S.essais) S.essais = {};
  if(!S.essais[cle]) S.essais[cle] = { n:0, bloqueJusqua:0 };
  return S.essais[cle];
}
function resteBlocage(cle){
  return Math.max(0, Math.ceil((compteur(cle).bloqueJusqua - Date.now()) / 1000));
}
function echec(cle, libelle){
  const e = compteur(cle);
  e.n++;
  if(e.n >= MAX_ESSAIS){
    // Le délai double à chaque série manquée : 1 min, 2, 4, 8… plafonné à 1 h.
    e.series = (e.series || 0) + 1;
    const delai = Math.min(3600, 60 * Math.pow(2, e.series - 1));
    e.bloqueJusqua = Date.now() + delai * 1000;
    e.n = 0;
    tracer('Connexion refusée', `${libelle} — bloqué ${delai} s après ${MAX_ESSAIS} essais`);
    sauver();
    return delai;
  }
  sauver();
  return 0;
}
function succes(cle){
  if(S.essais) S.essais[cle] = { n:0, bloqueJusqua:0, series:0 };
  sauver();
}

function demanderMdp(role){
  roleChoisi = role;
  const u = UTILISATEURS[role];
  $('#etape-roles').style.display = 'none';
  $('#etape-mdp').classList.add('on');
  $('#mdp-ic').textContent   = { ADMIN:'🔑', MANAGER:'📋', PREPARATEUR:'📦' }[role];
  $('#mdp-role').textContent = role;
  $('#mdp-qui').textContent  = u.nom;
  $('#mdp-champ').value = '';
  $('#mdp-err').textContent = '';

  // Empreinte : proposée seulement si elle a été activée pour ce profil
  const bio = S.biometrie && S.biometrie[role];
  $('#mdp-bio').innerHTML = bio
    ? `<button class="bio" onclick="connexionEmpreinte('${role}')">
         <span class="ic">👆</span>Déverrouiller avec l'empreinte</button>
       <div class="ou">OU MOT DE PASSE</div>` : '';

  // Récupération : réservée à l'ADMIN, et seulement si un code existe
  $('#mdp-oubli').innerHTML = (role === 'ADMIN' && S.codeSecours)
    ? `<button class="btn mini" style="width:100%;margin-top:14px;color:var(--txt3)"
         onclick="oublieMdp()">Mot de passe oublié ?</button>` : '';

  if(!bio) $('#mdp-champ').focus();
}
function retourRoles(){
  roleChoisi = null;
  $('#etape-mdp').classList.remove('on');
  $('#etape-roles').style.display = '';
}

async function validerMdp(){
  if(!roleChoisi) return;
  const champ = $('#mdp-champ'), err = $('#mdp-err'), bouton = $('#mdp-ok');
  const cle = 'mdp:' + roleChoisi;

  const reste = resteBlocage(cle);
  if(reste){ err.textContent = `Profil bloqué encore ${reste} s après trop d'essais.`; return; }
  if(!champ.value){ err.textContent = 'Saisissez le mot de passe.'; champ.focus(); return; }

  // La dérivation prend un instant : on le montre plutôt que de sembler figé.
  bouton.disabled = true; bouton.textContent = 'Vérification…';
  const stocke = S.motsDePasse[roleChoisi];
  const ok = await verifier(champ.value, stocke);
  bouton.disabled = false; bouton.textContent = 'Se connecter';

  if(ok){
    // Migration silencieuse d'une empreinte à l'ancien format
    if(ancienFormat(stocke)){
      S.motsDePasse[roleChoisi] = await empreinte(champ.value);
      tracer('Empreinte de mot de passe renforcée', `profil ${roleChoisi}`);
    }
    succes(cle);
    const r = roleChoisi;
    retourRoles();
    connexion(r);
    return;
  }

  const delai = echec(cle, roleChoisi);
  err.textContent = delai
    ? `${MAX_ESSAIS} essais manqués : profil bloqué ${delai >= 60 ? Math.round(delai/60)+' min' : delai+' s'}.`
    : `Mot de passe incorrect — ${MAX_ESSAIS - compteur(cle).n} essai(s) restant(s).`;
  champ.classList.add('faux');
  setTimeout(()=>champ.classList.remove('faux'), 320);
  champ.value = ''; champ.focus();
}

/* =========================================================================
   PHOTOS DU CATALOGUE
   Le stockage du navigateur plafonne à quelques Mo : une photo de téléphone
   brute (3 à 5 Mo) le saturerait dès le deuxième article. Chaque image est
   donc redimensionnée et recompressée avant d'être conservée.
   ========================================================================= */
const PHOTO_PX = 420;             // côté maximum
const PHOTO_QUALITE = 0.7;

let photoTemp = null;             // photo en cours d'édition dans la fiche article

function redimensionner(fichier){
  return new Promise((res, rej) => {
    const lecteur = new FileReader();
    lecteur.onerror = () => rej(new Error('lecture impossible'));
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('image illisible'));
      img.onload = () => {
        const f = Math.min(1, PHOTO_PX / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width  = Math.round(img.width  * f);
        c.height = Math.round(img.height * f);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#0a0a16';                 // aplat sous les PNG transparents
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', PHOTO_QUALITE));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

async function choisirPhoto(input){
  const f = input.files && input.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){ toast("Ce fichier n'est pas une image.", 'err'); return; }
  const apercu = $('#a-photo-apercu');
  apercu.innerHTML = '<span style="color:var(--txt3);font-size:12.5px">Compression…</span>';
  try{
    photoTemp = await redimensionner(f);
    apercu.innerHTML = `<img src="${photoTemp}" alt="">
      <div><div class="puce-cat">${Math.round(photoTemp.length*0.75/1024)} Ko après compression</div>
      <button class="btn mini r" onclick="retirerPhoto()">Retirer la photo</button></div>`;
  }catch(e){
    apercu.innerHTML = '';
    toast("Image illisible — essayez un autre fichier.", 'err');
  }
  input.value = '';
}
function retirerPhoto(){
  photoTemp = null;
  $('#a-photo-apercu').innerHTML = '';

function enregistrerArticle(id){
  const ref  = $('#a-ref').value.trim().toUpperCase();
  const nom  = $('#a-nom').value.trim();
  const cat  = $('#a-cat').value.trim();
  const qte  = parseInt($('#a-qte').value);
  const prix = parseFloat($('#a-prix').value);
  const valeur = parseFloat($('#a-valeur').value) || 0;

  if(!ref || !nom || !cat){ toast("Référence, désignation et catégorie sont obligatoires.", 'err'); return; }
  if(isNaN(qte) || qte < 0){ toast("Quantité invalide.", 'err'); return; }
  if(isNaN(prix) || prix < 0){ toast("Prix invalide.", 'err'); return; }
  if(valeur < 0){ toast("Valeur de remplacement invalide.", 'err'); return; }

  if(id){
    const a = S.articles.find(x=>x.id===id);
    const engage = reserve(a.id, auj().toISOString().slice(0,10), jour(365));
    if(qte < engage){
      toast(`Impossible : ${engage} unité(s) sont déjà engagées sur des commandes en cours.`, 'err'); return;
    }
    const avant = `${a.qte} au parc à ${fcfa(a.prix)}/j`;
    const photoAvant = a.photo || null;
    Object.assign(a, {nom, cat, qte, prix, valeur});
    if(photoTemp) a.photo = photoTemp; else delete a.photo;
    if(!sauverOuEchouer()){
      if(photoAvant) a.photo = photoAvant; else delete a.photo;
      sauver();
      toast("Mémoire de l'appareil pleine : photo non enregistrée. Supprimez des photos existantes.", 'err');
      return;
    }
    tracer('Modification article', `${a.ref} — ${avant} → ${qte} au parc à ${fcfa(prix)}/j`, a.id);
    toast(`${a.ref} mis à jour.`, 'ok');
  } else {
    if(S.articles.some(x=>x.ref===ref)){ toast(`La référence ${ref} existe déjà.`, 'err'); return; }
    const neuf = {id:ref, ref, nom, cat, qte, prix, valeur, unite:'unité'};
    if(photoTemp) neuf.photo = photoTemp;
    S.articles.push(neuf);
    if(!sauverOuEchouer()){
      delete neuf.photo;
      if(!sauverOuEchouer()){ S.articles.pop(); sauver();
        toast("Mémoire de l'appareil pleine : article non enregistré.", 'err'); return; }
      toast(`${ref} ajouté, mais sans la photo : mémoire pleine.`, 'err');
      tracer('Création article', `${ref} — ${nom} (photo refusée, mémoire pleine)`, ref);
      photoTemp = null; fermerModale(); rendre(); return;
    }
    tracer('Création article', `${ref} — ${nom} — ${qte} au parc à ${fcfa(prix)}/j`, ref);
    toast(`${ref} ajouté au catalogue.`, 'ok');
  }
  photoTemp = null;
  sauver(); fermerModale(); rendre();
}

function supprimerArticle(id){
  const a = S.articles.find(x=>x.id===id);
  const cites = S.commandes.filter(c=>c.statut!=='ANNULEE' && c.lignes.some(l=>l.articleId===id));
  if(cites.length){
    toast(`${a.ref} figure sur ${cites.length} commande(s) : mettez sa quantité à 0 plutôt que de le supprimer.`, 'err');
    return;
  }
  if(!confirm(`Supprimer définitivement « ${a.nom} » (${a.ref}) du catalogue ?`)) return;
  S.articles = S.articles.filter(x=>x.id!==id);
  tracer('Suppression article', `${a.ref} — ${a.nom}`, id);
  sauver(); rendre(); toast(`${a.ref} supprimé.`, 'ok');
}

function lancerImport(){
  const lignes = $('#imp').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lignes.length){ toast("Rien à importer.", 'err'); return; }

  let crees = 0, majs = 0;
  const refus = [];

  lignes.forEach((ligne, i) => {
    if(/^\s*(réf|ref)/i.test(ligne)) return;                    // ligne d'en-tete
    const col = ligne.split(/\t|;/).map(c=>c.trim());
    if(col.length < 5){ refus.push(`ligne ${i+1} : ${col.length} colonne(s) au lieu de 5`); return; }

    const [ref, nom, cat, qteBrute, prixBrut, valeurBrute] = col;
    const qte  = parseInt(String(qteBrute).replace(/[^\d]/g,''));
    const prix = parseFloat(String(prixBrut).replace(/[^\d]/g,''));
    const valeur = valeurBrute === undefined ? 0
                 : (parseFloat(String(valeurBrute).replace(/[^\d]/g,'')) || 0);

    if(!ref || !nom || !cat){ refus.push(`ligne ${i+1} : référence, désignation ou catégorie vide`); return; }
    if(isNaN(qte) || isNaN(prix)){ refus.push(`ligne ${i+1} : quantité ou prix illisible`); return; }

    const R = ref.toUpperCase();
    const ex = S.articles.find(x=>x.ref===R);
    if(ex){
      const engage = reserve(ex.id, auj().toISOString().slice(0,10), jour(365));
      if(qte < engage){ refus.push(`ligne ${i+1} : ${R} — ${engage} unité(s) déjà engagées`); return; }
      Object.assign(ex, {nom, cat, qte, prix});
      if(valeur) ex.valeur = valeur;            // colonne absente = valeur conservée
      majs++;
    } else {
      S.articles.push({id:R, ref:R, nom, cat, qte, prix, valeur, unite:'unité'}); crees++;
    }
  });

  tracer('Import catalogue', `${crees} création(s), ${majs} mise(s) à jour, ${refus.length} refus`);
  sauver(); fermerModale(); rendre();

  if(refus.length){
    modale('Import terminé', `
      <div class="alerte v"><b>${crees} article(s) créé(s)</b> et <b>${majs} mis à jour</b>.</div>
      <div class="alerte r"><b>${refus.length} ligne(s) ignorée(s)</b><br>
        ${refus.map(esc).join('<br>')}</div>
    `, `<button class="btn" onclick="fermerModale()">Fermer</button>`);
  } else {
    toast(`${crees} article(s) créé(s), ${majs} mis à jour.`, 'ok');
  }
}

/* ---------- Saisie d'une commande ---------- */
function nouvelleCommande(){
  brouillon = { etape:1, client:'', tel:'', lieu:'', debut:jour(3), fin:jour(4), lignes:[],
                remise:0, escompte:0, transport:0, transportNote:'', caution:0,
                acompte:0, encaisserAcompte:true };
  rechArt = { q:'', cat:'' };
  vueCourante = 'commandes'; rendre();
}
function etape(n){
  if(n === 2){
    if(!brouillon.client.trim()){ toast("Le nom du client est obligatoire.", 'err'); return; }
    if(!brouillon.lignes.length){ toast("Ajoutez au moins un article.", 'err'); return; }
  }
  brouillon.etape = n; rendre();
}
function majBrouillon(champ, val){
  brouillon[champ] = val;
  if(champ==='debut' && brouillon.fin < val) brouillon.fin = val;
  rendre();
}
function ajouterLigne(articleId){
  if(!articleId) return;
  const a = S.articles.find(x=>x.id===articleId);
  const ex = brouillon.lignes.find(l=>l.articleId===articleId);
  const d = dispo(articleId, brouillon.debut, brouillon.fin);
  if(ex){
    if(ex.qte + 1 > d){ toast(`Stock insuffisant : ${d} disponible(s) sur cette période.`, 'err'); return; }
    ex.qte++;
  } else {
    if(d < 1){ toast(`${a.nom} : aucune disponibilité sur cette période.`, 'err'); return; }
    brouillon.lignes.push({articleId, ref:a.ref, nom:a.nom, qte:1, prix:a.prix, remise:0});
  }
  rendre();
}
/* Incrément tactile : bien plus sûr qu'un champ numérique au pouce. */
function incQte(articleId, delta){
  const l = brouillon.lignes.find(x=>x.articleId===articleId);
  if(!l) return;
  const d = dispo(articleId, brouillon.debut, brouillon.fin);
  const q = l.qte + delta;
  if(q < 1){ retirerLigneBrouillon(articleId); return; }
  if(q > d){ toast(`Maximum ${d} sur cette période.`, 'err'); return; }
  l.qte = q; rendre();
}

function qteLigne(articleId, q){
  const l = brouillon.lignes.find(x=>x.articleId===articleId);
  const d = dispo(articleId, brouillon.debut, brouillon.fin);
  q = Math.max(1, parseInt(q)||1);
  if(q > d){ toast(`Maximum ${d} sur cette période.`, 'err'); q = d; }
  l.qte = q; rendre();
}
function retirerLigneBrouillon(articleId){
  // Sur un brouillon jamais enregistre, aucune validation n'est requise :
  // rien n'a encore ete promis au client.
  brouillon.lignes = brouillon.lignes.filter(l=>l.articleId!==articleId); rendre();
}
function enregistrerBrouillon(statut){
  if(!brouillon.client.trim()){ toast("Le nom du client est obligatoire.", 'err'); return; }
  if(!brouillon.lignes.length){ toast("Ajoutez au moins un article.", 'err'); return; }
  for(const l of brouillon.lignes){
    const d = dispo(l.articleId, brouillon.debut, brouillon.fin);
    if(l.qte > d){ toast(`${l.nom} : plus que ${d} disponible(s).`, 'err'); return; }
  }

  // Une réduction supérieure au seuil ne s'applique pas d'office à la création :
  // sinon il suffirait de créer la commande remisée pour contourner l'ADMIN.
  const demande = reductionTotale(brouillon);
  const aValider = (U.role !== 'ADMIN') && demande > SEUIL_REMISE;
  let motif = '';
  if(aValider){
    motif = prompt(`Réduction demandée : ${brouillon.remise} % de remise + ${brouillon.escompte} % d'escompte, soit ${demande} %.\n\nAu-delà de ${SEUIL_REMISE} %, l'ADMIN doit valider.\nLa commande sera enregistrée au tarif plein en attendant.\n\nMotif obligatoire :`, '');
    if(!motif){ toast("Enregistrement abandonné : le motif est obligatoire.", 'err'); return; }
  }

  S.compteur.cmd++;
  const c = Object.assign({}, brouillon, {
    id: uid('C'), num:'CMD-2026-'+String(S.compteur.cmd).padStart(3,'0'),
    statut, creeeLe:new Date().toISOString(), creeePar:U.nom, facture:null, retour:null
  });
  delete c.etape; delete c.encaisserAcompte;
  const remiseVoulue = c.remise, escompteVoulu = c.escompte;
  if(aValider){ c.remise = 0; c.escompte = 0; }

  S.commandes.push(c);
  tracer('Création commande', `${c.num} — ${c.client} — ${fcfa(totalCommande(c).net)}`, c.id);

  if(aValider){
    demanderValidation(c.id, 'REMISE', motif, {remise:remiseVoulue, escompte:escompteVoulu});
  }

  // L'acompte convenu, s'il est encaissé séance tenante, devient un règlement.
  if(brouillon.encaisserAcompte && brouillon.acompte > 0 && statut !== 'DEVIS'){
    S.paiements.push({ id:uid('P'), commandeId:c.id, montant:brouillon.acompte,
                       mode:'Acompte à la réservation', le:auj().toISOString().slice(0,10), par:U.nom });
    tracer('Encaissement', `Acompte de ${fcfa(brouillon.acompte)} sur ${c.num}`, c.id);
  }

  brouillon = null; sauver(); rendre();
  toast(aValider
    ? `${c.num} enregistrée au tarif plein — la réduction attend l'ADMIN.`
    : `${c.num} enregistrée (${statut.toLowerCase()}).`, 'ok');
}

/* =========================================================================
   ÉTAPE 2 — conditions financières et aperçu de la facture

/* Saisie d'une réduction : au choix en pourcentage ou en francs.
   Le mode retenu est mémorisé, et l'équivalent dans l'autre unité est
   affiché sous le champ pour lever toute ambiguïté. */
function champReduction(cle, titre, aide, b, base){
  const mode = b[cle + 'Mode'] || 'pct';
  const val  = b[cle] || 0;
  const montant = reduction(val, mode, base);
  const taux    = base ? montant / base * 100 : 0;
  return `
    <div class="champ">
      <label>${titre}</label>
      <div class="duo">
        <input type="number" min="0" step="${mode==='montant'?'5000':'0.5'}" value="${val}"
          onchange="majFinance('${cle}',this.value)">
        <div class="bascule">
          <button class="${mode==='pct'?'on':''}" onclick="modeReduction('${cle}','pct')">%</button>
          <button class="${mode==='montant'?'on':''}" onclick="modeReduction('${cle}','montant')">F CFA</button>
        </div>
      </div>
      <div class="puce-cat" style="margin-top:6px">${esc(aide)}${
        montant ? ` — soit <b style="color:var(--orange)">${mode==='pct' ? fcfa(montant) : pct(taux)}</b>` : ''}</div>
    </div>`;
}
function modeReduction(cle, mode){
  const b = brouillon;
  if((b[cle+'Mode'] || 'pct') === mode) return;
  // On convertit la valeur pour que le montant reste le même à la bascule
  const base = cle === 'remise' ? totalCommande(b).brut : totalCommande(b).netCom;
  const montant = reduction(b[cle] || 0, b[cle+'Mode'] || 'pct', base);
  b[cle+'Mode'] = mode;
  b[cle] = mode === 'montant' ? Math.round(montant)
                              : (base ? Math.round(montant / base * 1000) / 10 : 0);
  rendre();
}

function majFinance(champ, val){
  const n = Math.max(0, parseFloat(String(val).replace(',','.')) || 0);
  // Un pourcentage se plafonne à 100 ; un montant, non — il sera borné à la base.
  const enPct = (champ === 'remise' || champ === 'escompte')
                && (brouillon[champ + 'Mode'] || 'pct') === 'pct';
  brouillon[champ] = enPct ? Math.min(100, n) : n;
  rendre();
}
function acomptePct(p){
  const t = totalCommande(brouillon);
  brouillon.acompte = Math.round(t.total * p / 100);
  rendre();
}

/* Cascade de calcul, réutilisée par l'aperçu, la fiche commande et la facture. */
function cascade(t, dejaRegle, arbitre){
  const l = (lab, val, style) => `<div style="display:flex;justify-content:space-between;
    margin-bottom:6px;${style||''}"><span>${lab}</span><span>${val}</span></div>`;
  return `
    ${l('Total location', fcfa(t.brut), 'color:var(--txt2)')}
    ${t.remise ? l(`Remise ${pct(t.tauxRemise)}`, '− '+fcfa(t.remise), 'color:var(--orange)') : ''}
    ${t.remise ? l('Net commercial', fcfa(t.netCom), 'color:var(--txt2)') : ''}
    ${t.escompte ? l(`Escompte ${pct(t.tauxEscompte)}`, '− '+fcfa(t.escompte), 'color:var(--orange)') : ''}
    ${t.escompte ? l('Net financier', fcfa(t.netFin), 'color:var(--txt2)') : ''}
    ${t.transport ? l('Transport et livraison', fcfa(t.transport), 'color:var(--txt2)') : ''}
    ${l('Total', fcfa(t.total), 'font-weight:700')}
    ${t.retenue ? l('Retenue casse et manquants', fcfa(t.retenue), 'color:var(--rouge)') : ''}
    ${t.caution && !arbitre ? l('Caution consignée', fcfa(t.caution), 'color:var(--cyan)') : ''}
    ${l(arbitre ? 'Total dû' : (t.caution ? 'Total à encaisser' : 'Total'),
        fcfa(arbitre ? t.duFinal : t.aEncaisser), 'font-weight:700')}
    ${dejaRegle ? l('Déjà réglé', '− '+fcfa(dejaRegle), 'color:var(--vert)') : ''}`;
}

/* ---------- Fiche commande (modale) ---------- */
function ouvrirCommande(id){
  const c = S.commandes.find(x=>x.id===id);
  const t = totalCommande(c);
  const enc = encaisse(c.id), r = reste(c);
  const dem = S.validations.filter(v=>v.commandeId===c.id);
  const peutModifier = !['ANNULEE','FACTUREE','SOLDEE'].includes(c.statut);
  const argent = (U.role !== 'PREPARATEUR');   // pas de montants pour le dépôt

  modale(`Commande ${esc(c.num)}`, `
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
      <span class="et ${c.statut}">${c.statut}</span>
      <span style="color:var(--txt2)">créée par ${esc(c.creeePar)}</span>
    </div>
    <div class="paire" style="margin-bottom:6px">
      <div><div class="puce-cat">Client</div><b>${esc(c.client)}</b><br>
        <span style="color:var(--txt2)">${esc(c.tel||'—')}</span></div>
      <div><div class="puce-cat">Événement → Récupération</div><b>${frDate(c.debut)} → ${frDate(c.fin)}</b><br>
        <span style="color:var(--txt2)">${t.jours} jour(s) — ${esc(c.lieu||'lieu non précisé')}</span></div>
    </div>
    <div class="ligne-sep"></div>
    <table><thead><tr><th>Article</th><th class="num">Qté</th>
      ${argent ? '<th class="num">P.U./j</th><th class="num">Total</th>' : ''}
      ${peutModifier && argent ? '<th></th>' : ''}</tr></thead><tbody>
      ${c.lignes.map(l=>{
        const brut = l.qte*l.prix*t.jours;
        const art = S.articles.find(x=>x.id===l.articleId);
        return `<tr>
          <td><div class="avec-photo">
            ${art && art.photo ? `<img class="vignette" src="${art.photo}" alt=""
                                    onclick="voirPhoto('${l.articleId}')">` : ''}
            <span>${esc(l.nom)}<div class="puce-cat">${esc(l.ref)}</div></span>
          </div></td>
          <td class="num">${l.qte}</td>
          ${argent ? `<td class="num">${fcfa(l.prix)}</td>
          <td class="num">${fcfa(brut*(1-(l.remise||0)/100))}
            ${l.remise?`<div class="puce-cat" style="color:var(--orange)">remise ${l.remise}%</div>`:''}</td>` : ''}
          ${peutModifier && argent
            ? `<td><button class="btn mini r" title="Retirer cet article"
                 onclick="demanderRetrait('${c.id}','${l.articleId}')">✕</button></td>` : ''}
        </tr>`;
      }).join('')}
    </tbody></table>
    <div class="ligne-sep"></div>
    ${argent ? `
    ${cascade(t, enc, c.retenuesFaites)}
    ${aRestituer(c) > 0
      ? `<div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;color:var(--cyan)">
           <span>À restituer au client</span><span>${fcfa(aRestituer(c))}</span></div>`
      : `<div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;
           color:${r>0?'var(--rose-clair)':'var(--vert)'}">
           <span>${r>0?'Reste à payer':'Soldé'}</span><span>${fcfa(r)}</span></div>`}
    ${c.facture?`<div class="puce-cat" style="margin-top:7px">Facture ${esc(c.facture.num)} du ${frDate(c.facture.le)}</div>`:''}`
    : `<div style="display:flex;justify-content:space-between;font-size:17px;font-weight:700">
        <span>Total à charger</span>
        <span style="color:var(--cyan)">${c.lignes.reduce((n,l)=>n+l.qte,0)} pièces</span></div>`}

    ${c.retour?`<div class="ligne-sep"></div><div class="alerte">
      <b>Retour du ${frDate(c.retour.le)}</b><br>
      ${c.retour.casse.map(x=>`Casse : ${x.qte} × ${esc(x.ref)} — ${esc(x.note)}`).join('<br>')||''}
      ${c.retour.manquant.map(x=>`<br>Manquant : ${x.qte} × ${esc(x.ref)} — ${esc(x.note)}`).join('')||''}
    </div>`:''}

    ${dem.length && argent?`<div class="ligne-sep"></div>
      <div class="puce-cat" style="margin-bottom:8px">Demandes de validation</div>
      ${dem.map(v=>`<div style="display:flex;gap:9px;align-items:flex-start;margin-bottom:8px;font-size:13px">
        <span class="et ${v.statut}">${v.statut.replace('_',' ')}</span>
        <div><b>${v.type}</b> — ${esc(v.motif)}
          <div class="puce-cat">par ${esc(v.demandeur)}${v.decideur?` · tranché par ${esc(v.decideur)}`:''}</div>
        </div></div>`).join('')}`:''}
  `, boutonsCommande(c, peutModifier));

function boutonsCommande(c, peutModifier){
  const b = [];
  if(U.role !== 'PREPARATEUR')
    b.push(`<button class="btn" onclick="voirFacture('${c.id}')">${c.facture?'Voir la facture':'Voir la proforma'}</button>`);
  if(peutModifier && U.role !== 'PREPARATEUR'){
    b.push(`<button class="btn" onclick="demanderRemise('${c.id}')">Remise / escompte</button>`);
    b.push(`<button class="btn r" onclick="demanderAnnulation('${c.id}')">Annuler la commande</button>`);
  }
  if(c.statut==='DEVIS' && U.role!=='PREPARATEUR')
    b.push(`<button class="btn c" onclick="passerA('${c.id}','RESERVEE')">Confirmer la réservation</button>`);
  if(c.statut==='RETOURNEE' && U.role!=='PREPARATEUR')
    b.push(`<button class="btn p" onclick="facturer('${c.id}')">Facturer</button>`);
  if(c.facture && reste(c)>0 && U.role!=='PREPARATEUR')
    b.push(`<button class="btn p" onclick="encaisser('${c.id}')">Encaisser</button>`);
  if(aRestituer(c)>0 && U.role!=='PREPARATEUR')
    b.push(`<button class="btn c" onclick="restituerCaution('${c.id}')">Restituer ${fcfa(aRestituer(c))}</button>`);
  b.push(`<button class="btn" onclick="fermerModale()">Fermer</button>`);
  return b.join('');
}

function passerA(id, statut){
  const c = S.commandes.find(x=>x.id===id);
  if(statut==='RESERVEE'){
    for(const l of c.lignes){
      const d = dispo(l.articleId, c.debut, c.fin, c.id);
      if(l.qte > d){ toast(`${l.nom} : plus que ${d} disponible(s) sur ces dates.`, 'err'); return; }
    }
  }
  const avant = c.statut; c.statut = statut;
  tracer('Changement d\'état', `${c.num} : ${avant} → ${statut}`, c.id);
  sauver(); fermerModale(); rendre();
  toast(`${c.num} : ${statut.toLowerCase()}.`, 'ok');
}

/* ---------- Les trois actions sous controle ADMIN ---------- */
function demanderRetrait(cmdId, articleId){
  const c = S.commandes.find(x=>x.id===cmdId);
  const l = c.lignes.find(x=>x.articleId===articleId);
  if(c.lignes.length<=1){ toast("Une commande doit garder au moins un article. Annulez-la plutôt.", 'err'); return; }
  if(!exigeValidation('RETRAIT')){
    c.lignes = c.lignes.filter(x=>x.articleId!==articleId);
    tracer('Retrait d\'article', `${c.num} : ${l.nom} retiré directement (ADMIN)`, c.id);
    sauver(); fermerModale(); rendre();
    toast(`${l.nom} retiré.`, 'ok'); return;
  }
  const motif = prompt(`Retirer « ${l.nom} » de ${c.num}.\n\nCette action doit être validée par l'ADMIN.\nMotif obligatoire :`, '');
  if(!motif){ toast("Retrait abandonné : le motif est obligatoire.", 'err'); return; }
  demanderValidation(cmdId, 'RETRAIT', motif, {articleId, nom:l.nom});
  fermerModale(); rendre();
  toast("Demande transmise à l'ADMIN. L'article reste sur la commande en attendant.", 'ok');
}

function demanderRemise(cmdId){
  const c = S.commandes.find(x=>x.id===cmdId);
  const sr = prompt(`Remise commerciale sur ${c.num} (en %) :`, String(c.remise||0));
  if(sr===null) return;
  const se = prompt(`Escompte pour paiement anticipé sur ${c.num} (en %) :`, String(c.escompte||0));
  if(se===null) return;
  const remise = parseFloat(String(sr).replace(',','.')), escompte = parseFloat(String(se).replace(',','.'));
  if(isNaN(remise)||isNaN(escompte)||remise<0||escompte<0||remise>100||escompte>100){
    toast("Pourcentage invalide.", 'err'); return; }
  const total = remise + escompte;

  if(!exigeValidation('REMISE', total)){
    c.remise = remise; c.escompte = escompte;
    tracer('Réduction appliquée',
      `${c.num} : remise ${remise}% + escompte ${escompte}%${U.role==='ADMIN'?' (ADMIN)':' (sous le seuil)'}`, c.id);
    sauver(); fermerModale(); rendre();
    toast(`Réduction de ${total}% appliquée.`, 'ok'); return;
  }
  const motif = prompt(`Réduction totale de ${total} % (remise ${remise} % + escompte ${escompte} %).\nElle dépasse le seuil de ${SEUIL_REMISE} % et doit être validée par l'ADMIN.\n\nMotif obligatoire :`, '');
  if(!motif){ toast("Réduction abandonnée : le motif est obligatoire.", 'err'); return; }
  demanderValidation(cmdId, 'REMISE', motif, {remise, escompte});
  fermerModale(); rendre();
  toast(`Demande de réduction ${total}% transmise à l'ADMIN.`, 'ok');
}

function demanderAnnulation(cmdId){
  const c = S.commandes.find(x=>x.id===cmdId);
  if(!exigeValidation('ANNULATION')){
    if(!confirm(`Annuler définitivement ${c.num} ?`)) return;
    c.statut = 'ANNULEE';
    tracer('Annulation', `${c.num} annulée directement (ADMIN)`, c.id);
    sauver(); fermerModale(); rendre();
    toast(`${c.num} annulée.`, 'ok'); return;
  }
  const motif = prompt(`Annuler ${c.num} (${c.client}).\n\nCette action doit être validée par l'ADMIN.\nMotif obligatoire :`, '');
  if(!motif){ toast("Annulation abandonnée : le motif est obligatoire.", 'err'); return; }
  demanderValidation(cmdId, 'ANNULATION', motif, {});
  fermerModale(); rendre();
  toast("Demande d'annulation transmise à l'ADMIN.", 'ok');
}

function marquerLivre(id){

function saisirRetour(id){

function validerRetour(id){
  const c = S.commandes.find(x=>x.id===id);
  const casse = [], manquant = [];
  c.lignes.forEach((l,i)=>{
    const k = parseInt($('#k'+i).value)||0, m = parseInt($('#m'+i).value)||0;

    if(m>0) manquant.push({ref:l.ref, nom:l.nom, qte:m, note:'non restitué'});
  });
  c.retour = { le:auj().toISOString().slice(0,10), casse, manquant,
               obs:$('#obs').value, par:U.nom };
  c.statut = 'RETOURNEE';
  tracer('Retour enregistré',
    `${c.num} — ${casse.length} casse(s), ${manquant.length} manquant(s)`, c.id);
  sauver(); fermerModale(); rendre();
  toast(`Retour de ${c.num} enregistré.`, 'ok');
}

/* ---------- Arbitrage des dégâts avant facturation ---------- */
function arbitrerRetenues(id){
  const c = S.commandes.find(x=>x.id===id);
  const inc = incidents(c);
  const t = totalCommande(c);

  modale(`Retenues sur caution — ${esc(c.num)}`, `
    <div class="alerte">Le préparateur a constaté ${inc.length} incident(s) au retour du
      ${frDate(c.retour.le)}. Chiffrez ce qui reste à la charge du client :
      les montants sont pré-remplis à la <b>valeur de remplacement</b> du catalogue,
      corrigez-les librement.</div>
    <div class="tbl-scroll">
    <table><thead><tr><th>Incident</th><th class="num">Qté</th>
      <th class="num" style="width:120px">P.U.</th><th class="num" style="width:130px">Retenue</th>
      </tr></thead><tbody>
      ${inc.map((x,i)=>{
        const a = S.articles.find(y=>y.ref===x.ref);
        const pu = (a && a.valeur) ? a.valeur : 0;
        return `<tr>
          <td><b>${esc(x.nom || (a?a.nom:x.ref))}</b>
            <div class="puce-cat">${esc(x.ref)} — ${x.type==='CASSE'?'cassé':'non restitué'}</div></td>
          <td class="num">${x.qte}</td>
          <td class="num" style="color:var(--txt2)">${fcfa(pu)}</td>
          <td><input id="ret${i}" type="number" min="0" step="1000" value="${pu*x.qte}"
            oninput="majTotalRetenues()" style="width:120px;padding:6px 9px;text-align:right;
            background:#0a0a16;border:1px solid var(--bord);border-radius:6px"></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>
    <div class="champ" style="margin-top:14px"><label>Observation portée sur la facture</label>
      <input id="ret-note" value="${esc(c.retour.obs||'')}" placeholder="Facultatif"></div>
    <div class="ligne-sep"></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--txt2)">
      <span>Caution consignée</span><span>${fcfa(t.caution)}</span></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--orange)">
      <span>Total des retenues</span><span id="ret-total" data-caution="${t.caution}">—</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:700">
      <span id="ret-lab">Caution restituée</span><span id="ret-solde">—</span></div>
    <div class="alerte c" style="margin:14px 0 0">Une retenue supérieure à la caution
      n'est pas perdue : l'excédent est reporté sur la facture.</div>
  `, `<button class="btn" onclick="fermerModale()">Annuler</button>
      <button class="btn v" onclick="validerRetenues('${c.id}')">Valider et facturer</button>`);
  majTotalRetenues();
}

function majTotalRetenues(){
  let total = 0, i = 0, e;
  while((e = $('#ret'+i))){ total += parseFloat(e.value)||0; i++; }
  const caution = parseFloat($('#ret-total').dataset.caution || 0);
  $('#ret-total').textContent = fcfa(total);
  const rendue = Math.max(0, caution - total), exces = Math.max(0, total - caution);
  $('#ret-lab').textContent  = exces ? 'À ajouter à la facture' : 'Caution restituée';
  $('#ret-solde').textContent = exces ? fcfa(exces) : fcfa(rendue);
  $('#ret-solde').style.color = exces ? 'var(--rouge)' : 'var(--vert)';
}

function validerRetenues(id){
  const c = S.commandes.find(x=>x.id===id);
  const inc = incidents(c);
  c.retenues = inc.map((x,i)=>{
    const a = S.articles.find(y=>y.ref===x.ref);
    return { ref:x.ref, nom:x.nom || (a?a.nom:x.ref), type:x.type, qte:x.qte,
             montant: Math.max(0, parseFloat($('#ret'+i).value)||0) };
  }).filter(x=>x.montant > 0);
  c.retenuesFaites = true;
  c.retenuesNote = $('#ret-note').value;
  const t = totalCommande(c);
  tracer('Retenues arbitrées',
    `${c.num} : ${fcfa(t.retenue)} retenus sur ${fcfa(t.caution)} de caution`
    + (t.excedent ? ` — excédent de ${fcfa(t.excedent)} reporté sur la facture` : ''), c.id);
  sauver(); fermerModale();
  emettreFacture(id);
}

function facturer(id){
  const c = S.commandes.find(x=>x.id===id);
  // S'il y a des dégâts non arbitrés, on les chiffre avant d'émettre la facture.
  if(incidents(c).length && !c.retenuesFaites){ arbitrerRetenues(id); return; }
  if(c.retour && !c.retenuesFaites) c.retenuesFaites = true;   // retour sans incident
  emettreFacture(id);
}

function emettreFacture(id){
  const c = S.commandes.find(x=>x.id===id);
  S.compteur.fac++;
  c.facture = { num:'FAC-2026-'+String(S.compteur.fac).padStart(3,'0'),
                le:auj().toISOString().slice(0,10), par:U.nom };
  c.statut = 'FACTUREE';
  tracer('Facturation', `${c.facture.num} émise pour ${c.num} — ${fcfa(totalCommande(c).net)}`, c.id);
  sauver(); fermerModale(); rendre();
  toast(`${c.facture.num} émise.`, 'ok');
}
function encaisser(id){
  const c = S.commandes.find(x=>x.id===id);
  const r = reste(c);
  modale(`Encaissement — ${esc(c.facture.num)}`, `
    <div style="display:flex;justify-content:space-between;margin-bottom:14px">
      <span style="color:var(--txt2)">Reste dû</span>
      <b style="font-size:19px;color:var(--rouge)">${fcfa(r)}</b></div>
    <div class="champ"><label>Montant encaissé <i class="req">*</i></label>
      <input id="pmt" type="number" min="1" max="${r}" value="${r}"></div>
    <div class="champ"><label>Mode de règlement</label>
      <select id="mode"><option>Espèces</option><option>Mobile money</option>
        <option>Virement</option><option>Chèque</option></select></div>
  `, `<button class="btn" onclick="fermerModale()">Annuler</button>
      <button class="btn p" onclick="validerPaiement('${c.id}')">Enregistrer le règlement</button>`);
}
/* Restitution de la caution : un mouvement de caisse en sens inverse. */
function restituerCaution(id){
  const c = S.commandes.find(x=>x.id===id);
  const m = aRestituer(c);
  const t = totalCommande(c);
  if(!confirm(`Restituer ${fcfa(m)} à ${c.client} ?\n\n`
    + `Caution consignée : ${fcfa(t.caution)}\n`
    + `Retenue casse et manquants : ${fcfa(t.retenue)}\n`
    + `Solde rendu : ${fcfa(m)}`)) return;
  S.paiements.push({ id:uid('P'), commandeId:id, montant:-m, mode:'Restitution de caution',
                     le:auj().toISOString().slice(0,10), par:U.nom });
  if(reste(c) <= 0 && c.facture) c.statut = 'SOLDEE';
  tracer('Restitution de caution', `${fcfa(m)} rendus sur ${c.num}`, id);
  sauver(); fermerModale(); rendre();
  toast(`${fcfa(m)} restitués au client.`, 'ok');
}

function validerPaiement(id){
  const c = S.commandes.find(x=>x.id===id);
  const m = parseFloat($('#pmt').value);
  if(!m || m<=0){ toast("Montant invalide.", 'err'); return; }
  S.paiements.push({ id:uid('P'), commandeId:id, montant:m, mode:$('#mode').value,
                     le:auj().toISOString().slice(0,10), par:U.nom });
  tracer('Encaissement', `${fcfa(m)} sur ${c.facture.num} (${$('#mode').value})`, id);
  if(reste(c) <= 0) c.statut = 'SOLDEE';
  sauver(); fermerModale(); rendre();
  toast(`${fcfa(m)} encaissés.`, 'ok');
}

function formMdp(role){
  const soi = (role === U.role);
  const admin = (U.role === 'ADMIN');
  modale(`Mot de passe — ${esc(role)}`, `
    ${soi ? `<div class="champ"><label>Mot de passe actuel <i class="req">*</i></label>
      <input type="password" id="m-actuel" autocomplete="current-password"></div>` : ''}
    <div class="champ"><label>Nouveau mot de passe <i class="req">*</i></label>
      <input type="password" id="m-neuf" autocomplete="new-password">
      <div class="puce-cat" style="margin-top:5px">${MDP_MIN} caractères minimum,
        pas uniquement des chiffres</div></div>
    <div class="champ" style="margin-bottom:0"><label>Confirmer <i class="req">*</i></label>
      <input type="password" id="m-conf" autocomplete="new-password"
        onkeydown="if(event.key==='Enter')enregistrerMdp('${role}')"></div>
    ${(!soi && admin) ? `<div class="alerte" style="margin:16px 0 0">
      Vous modifiez le mot de passe d'un autre profil : pensez à le communiquer
      à la personne concernée.</div>` : ''}
  `, `<button class="btn" onclick="fermerModale()">Annuler</button>
      <button class="btn p" onclick="enregistrerMdp('${role}')">Enregistrer</button>`);
  setTimeout(()=>{ const p = $(soi ? '#m-actuel' : '#m-neuf'); if(p) p.focus(); }, 60);
}

async function enregistrerMdp(role){
  const soi = (role === U.role);
  const neuf = $('#m-neuf').value, conf = $('#m-conf').value;

  if(soi && !await verifier($('#m-actuel').value, S.motsDePasse[role])){
    toast("Mot de passe actuel incorrect.", 'err'); return;
  }
  const souci = critiquerMdp(neuf, role);
  if(souci){ toast(souci, 'err'); return; }
  if(neuf !== conf){ toast("Les deux saisies ne correspondent pas.", 'err'); return; }

  S.motsDePasse[role] = await empreinte(neuf);
  if(!S.mdpChange) S.mdpChange = {};
  S.mdpChange[role] = true;
  tracer('Mot de passe modifié', `profil ${role}`);
  sauver(); fermerModale(); rendre();
  toast(`Mot de passe du profil ${role} mis à jour.`, 'ok');
}

function serveurConf(){
  if(!S.serveur) S.serveur = { url:'', cle:'', testeLe:null, etat:null, detail:'' };

}

function vueServeur(){

      : `<div class="alerte ${s.etat === 'ok' ? 'v' : (s.etat === 'ko' ? 'r' : '')}">
           <b>${s.etat === 'ok' ? '✓ Serveur joignable'
